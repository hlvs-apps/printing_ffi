name: printing_ffi
description: "A Flutter plugin for direct printer communication using native FFI bindings for macOS, Windows, Linux, and Android."
version: 0.1.0
homepage: https://www.shreeman.dev
repository: https://github.com/Shreemanarjun/printing_ffi
issue_tracker: https://github.com/Shreemanarjun/printing_ffi/issues
license: MIT
topics:
 - printing
 - print
 - thermal-printer
 - ffi
 - pos-printer


environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  # Android only: renders the bundled cupsd web interface in-app for
  # openCupsSettings()/openCupsPrinterSettings(). webview_flutter's native side is
  # Android/iOS; on desktop it is an inert, never-instantiated dependency (the web
  # UI helpers no-op off Android).
  webview_flutter: ^4.10.0
  # Android only: persists seen DNP USB device signatures (vid:pid:serial) so a known,
  # already-permitted printer is auto-opened on reattach without re-prompting. Inert
  # off Android (the DNP auto-detect layer only runs there).
  shared_preferences: ^2.3.2

dev_dependencies:
  ffigen: ^20.0.0-dev.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  plugin:
    platforms:
      android:
        # Hybrid plugin: FFI for the CUPS/print ops (same C ABI as desktop) plus a
        # Kotlin pluginClass (PrintingFfiPlugin) hosting the cups + USB MethodChannels
        # and the usb_events EventChannel (bundled-cupsd asset extraction, DNP USB
        # permission + fd handshake, and the foreground service). Auto-registered, so
        # consumers add no Kotlin.
        # NOTE: the package stays `com.example.printing_ffi` for now; renaming it to a
        # real `dev.<...>` domain is a cosmetic follow-up (out of this stage's scope).
        ffiPlugin: true
        package: com.example.printing_ffi
        pluginClass: PrintingFfiPlugin
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
