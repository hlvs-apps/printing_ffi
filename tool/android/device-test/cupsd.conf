# cupsd.conf for on-device boot spike (Android arm64)
# Minimal, TCP-only (no domain socket), no TLS, no auth. Localhost only.

LogLevel debug2
MaxLogSize 0
PageLogFormat

# TCP only, loopback, non-privileged port (no domain-socket Listen).
Listen 127.0.0.1:10631

# No mDNS/DNS-SD browsing on Android.
Browsing Off

# No authentication for the local spike.
DefaultAuthType None
WebInterface No

# Default error policy for printers
ErrorPolicy retry-job

# Permissive access for the spike.
<Location />
  Order allow,deny
  Allow from all
</Location>

<Location /admin>
  Order allow,deny
  Allow from all
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow from all
</Location>

# Wide-open default policy: every operation permitted with no auth.
<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit All>
    Order allow,deny
    Allow from all
  </Limit>
</Policy>
