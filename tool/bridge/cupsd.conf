# cupsd.conf for a Fotobox print bridge (tool/bridge/, topology B).
#
# Installed by the fotobox-print-bridge package, which keeps the previous file
# as /etc/cups/cupsd.conf.fotobox-orig and restores it on purge.
#
# This box shares its USB dye-sub queue with the Fotobox app on the booth LAN:
#  - it listens on every interface but only ANSWERS the local subnets (@LOCAL);
#  - every request from the network authenticates (HTTP Basic) as a member of
#    the CUPS admin group, i.e. the `fotobox-print` user whose password is the
#    bridge token (see fotobox-print-bridge-pair). The bridge daemon itself
#    authenticates as root over the local socket;
#  - no TLS: the iOS app's CUPS client is built without it, so the booth LAN is
#    the trust boundary. Do not expose this port beyond it.

LogLevel warn
MaxLogSize 1m
PageLogFormat

Port 631
Listen /run/cups/cups.sock

# Advertise the queue on the LAN (the app finds the bridge through the avahi
# service _fotobox-cups._tcp; the shared queue is advertised as _ipp._tcp).
Browsing On
BrowseLocalProtocols dnssd
DefaultShared Yes

DefaultAuthType Basic
DefaultEncryption Never
WebInterface Yes
# Stay up for the network clients; systemd only socket-activates the local socket.
IdleExitTimeout 0

<Location />
  Order allow,deny
  Allow @LOCAL
  AuthType Basic
  Require user @SYSTEM
</Location>

<Location /admin>
  Order allow,deny
  Allow @LOCAL
  AuthType Basic
  Require user @SYSTEM
</Location>

<Location /admin/conf>
  Order allow,deny
  Allow @LOCAL
  AuthType Basic
  Require user @SYSTEM
</Location>

<Location /admin/log>
  Order allow,deny
  Allow @LOCAL
  AuthType Basic
  Require user @SYSTEM
</Location>

# Job and printer operations: the stock CUPS policy. Network clients already
# authenticated as @SYSTEM above, so the app may cancel jobs and pause, resume
# or re-enable the printer as it does on the device.
<Policy default>
  JobPrivateAccess default
  JobPrivateValues default
  SubscriptionPrivateAccess default
  SubscriptionPrivateValues default

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
