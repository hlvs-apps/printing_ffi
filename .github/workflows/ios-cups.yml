name: iOS bundled CUPS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'tool/ios/**'
      - 'src/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-cups.yml'
concurrency:
  group: ios-cups-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: brew install pkg-config cmake
      - name: Build native iOS runtime
        run: bash tool/ios/build.sh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build device example with bundled printing runtime
        working-directory: example
        run: flutter build ios --release --no-codesign
      - name: Verify FFI exports and bundled runtime
        run: python3 tool/ios/check_bundle.py example/build/ios/iphoneos/Runner.app
