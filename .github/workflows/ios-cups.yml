name: iOS bundled CUPS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'tool/ios/**'
      - 'src/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-cups.yml'
concurrency:
  group: ios-cups-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: brew install pkg-config cmake
      - name: Build native iOS runtime
        run: bash tool/ios/build.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true
      - name: Build device example with bundled printing runtime
        working-directory: example
        run: |
          if flutter build ios --release --no-codesign -v > /tmp/ios-build.log 2>&1; then
            grep 'Built ' /tmp/ios-build.log || true
          else
            grep -E -B3 -A8 'dsymutil|debug map|GenerateDSYM|error:|Error \(|failed|Failed|libcups\.a|libcupsimage\.a' /tmp/ios-build.log || true
            for library in "$HOME"/Library/Developer/Xcode/DerivedData/Runner-*/Build/Products/libcups*.a; do
              if [ -f "$library" ]; then file "$library"; fi
            done
            exit 1
          fi
      - name: Verify FFI exports and bundled runtime
        run: python3 tool/ios/check_bundle.py example/build/ios/iphoneos/Runner.app
