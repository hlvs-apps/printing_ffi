name: iOS bundled CUPS
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'tool/ios/**'
      - 'src/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/ios-cups.yml'
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install native build tools
        run: brew install pkg-config cmake
      - name: Build device example with bundled printing runtime
        working-directory: example
        run: flutter build ios --release --no-codesign
